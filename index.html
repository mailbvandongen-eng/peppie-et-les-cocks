<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d3a36">
<title>Peppie et les Cocks</title>
<style>
:root{--geel:#f2c230;--donker:#14201ee8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1d3a36;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
[hidden]{display:none!important}
#laden{position:fixed;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:#1d3a36;z-index:20}
#laden b{font-size:26px}#laden span{display:block;width:220px;height:6px;border-radius:4px;background:#fff3;overflow:hidden}
#laden span::after{content:"";display:block;height:100%;width:calc(var(--v,0)*100%);background:var(--geel)}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:16px;background:linear-gradient(#0c1a18cc,#0c1a1855 55%,#0c1a18cc);z-index:10;overflow:auto}
#menu h1{margin:0;font-size:clamp(26px,6vw,46px);letter-spacing:.02em}#menu h1 i{color:var(--geel);font-style:normal}
#menu p{margin:0 0 6px;opacity:.85}
#spelers{display:grid;grid-template-columns:repeat(4,minmax(70px,140px));gap:8px}
#spelers button{font:inherit;color:#fff;padding:8px 6px;border-radius:12px;border:2px solid #fff3;background:#16302ccc;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#spelers button.aan{border-color:var(--geel);background:#2a4a40}#spelers img{width:min(19vw,20vh,96px);height:min(19vw,20vh,96px);border-radius:50%;box-shadow:0 2px 8px #0008;transition:transform .15s}#spelers button.aan img{transform:scale(1.08);box-shadow:0 0 0 3px var(--geel),0 2px 10px #000a}#spelers b{font-size:16px}#spelers small{font-size:11px;opacity:.8}
#missies{display:grid;grid-template-columns:repeat(2,minmax(150px,260px));gap:10px}
#missies button{font:inherit;color:#fff;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid #fff3;background:#16302ccc;cursor:pointer}
#missies b{display:block;font-size:17px;color:var(--geel)}#missies small{opacity:.85;line-height:1.3;display:block;margin-top:3px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto;font:inherit;color:#fff;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#missie{transition:opacity 1s;position:absolute;left:62%;top:calc(max(8px,env(safe-area-inset-top)) + 40px);transform:translateX(-50%);max-width:min(70vw,560px);padding:7px 14px;border-radius:12px;background:#0009;font-size:14px;text-align:center}
#tel{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;top:max(8px,env(safe-area-inset-top));padding:7px 12px;border-radius:12px;background:#0009;font-weight:700}
#stop{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));padding:7px 12px;border-radius:12px;background:#0009}
#knopA{z-index:2;position:absolute;right:max(22px,env(safe-area-inset-right));bottom:28px;width:104px;height:104px;border-radius:50%;background:#1f6f43e6;box-shadow:0 0 0 3px #fff5;font-weight:800;font-size:17px}
#knopB{position:absolute;right:max(140px,env(safe-area-inset-right));bottom:28px;width:78px;height:78px;border-radius:50%;background:#35506ee6;box-shadow:0 0 0 3px #fff4;font-weight:700}
#knopOp,#knopNeer{z-index:2;position:absolute;right:max(140px,env(safe-area-inset-right));width:66px;height:66px;border-radius:50%;background:#35506ee6;box-shadow:0 0 0 3px #fff4;font-size:26px}
#knopOp{bottom:104px}#knopNeer{bottom:28px}
#knopLinks,#knopRechts{position:absolute;right:max(214px,env(safe-area-inset-right));width:60px;height:60px;border-radius:50%;background:#5a4a2ee6;box-shadow:0 0 0 3px #fff4;font-size:26px}
#knopLinks{bottom:104px}#knopRechts{bottom:31px}
#hud button.in{transform:scale(.93);filter:brightness(1.25)}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:radial-gradient(#0003,#0005);border:2px solid #fff6;pointer-events:auto;touch-action:none;z-index:2}
#stick i{position:absolute;left:45px;top:45px;width:60px;height:60px;border-radius:50%;background:#fffd;box-shadow:0 2px 8px #0008;pointer-events:none}
#stick::before,#stick::after{content:"";position:absolute;left:50%;top:50%;background:#fff4;transform:translate(-50%,-50%)}#stick::before{width:2px;height:70%}#stick::after{width:70%;height:2px}
#stick.zacht{opacity:.5}
#weergave{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px #fff5;z-index:3}
#weergave button{padding:9px 12px;background:#0d2230d9;font-weight:800;font-size:15px}#weergave button.aan{background:#1f6fa8}
#scope.vol{border:0;border-radius:0}
#scope{touch-action:none;pointer-events:auto;z-index:1}
#span{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:min(44vw,300px);height:14px;border-radius:8px;background:#0008;overflow:hidden;box-shadow:inset 0 0 0 2px #fff4}
#span i{display:block;height:100%;width:40%;background:#57c26a}
#meter{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);font-weight:800;text-shadow:0 1px 3px #000}
#melding{position:absolute;left:50%;top:26%;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:#000b;font-size:20px;font-weight:700;text-align:center;max-width:80vw}
#scope{position:absolute;left:8px;top:52px;width:50vw;height:28vw;border-radius:8px;border:3px solid #15181c;box-shadow:0 4px 18px #0009;background:#000}
#uitslag{position:fixed;inset:0;display:grid;place-content:center;background:#0008;z-index:12}
#uitslag div{background:var(--donker);border-radius:18px;padding:22px 28px;text-align:center;max-width:86vw}
#uitslag h2{margin:0 0 6px;color:var(--geel)}#uitslag p{margin:0 0 16px;opacity:.9}
#uitslag button{font:inherit;color:#fff;border:0;padding:12px 24px;margin:0 6px;border-radius:12px;background:#2f7dd1;font-weight:700;cursor:pointer}#uitslag #terug{background:#4a525a}
#versie{position:fixed;right:8px;bottom:4px;font-size:10px;opacity:.5;z-index:11}
@media (orientation:portrait){#tel{top:calc(max(8px,env(safe-area-inset-top)) + 46px);font-size:15px}#missie{top:calc(max(8px,env(safe-area-inset-top)) + 88px)}}
#pip{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 40px);width:min(30vw,260px);aspect-ratio:4/3;border:3px solid #fff8;border-radius:10px;box-shadow:0 3px 12px #0008;pointer-events:none}#pip span{position:absolute;left:6px;bottom:4px;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}
#knopA.rood{background:radial-gradient(circle at 40% 35%,#ff6a5a,#c0281c 70%);box-shadow:0 0 0 3px #fff6,0 4px 12px #0008}
#slip{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:150px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#0009;border-radius:12px;padding:6px;z-index:2}#slip button{width:48px;height:40px;border-radius:10px;background:#35506ee6;font-size:22px}#slip span{font-size:12px;font-weight:700}
</style>
</head>
<body>
<div id="laden"><b>Peppie et les Cocks</b><span></span>laden…</div>
<div id="menu" hidden>
  <h1>Peppie <i>et les</i> Cocks</h1>
  <p>Vissen op de Lot · Le Temple-sur-Lot</p>
  <div id="spelers">
    <button data-speler="paul"><img src="assets/portret/paul.png" alt=""><b>Paul</b><small>de rooie</small></button>
    <button data-speler="dave"><img src="assets/portret/dave.png" alt=""><b>Dave</b><small>pet op</small></button>
    <button data-speler="bob"><img src="assets/portret/bob.png" alt=""><b>Bob</b><small>de kale</small></button>
    <button data-speler="wim"><img src="assets/portret/wim.png" alt=""><b>Wim</b><small>strepenkijker, Fristi</small></button>
  </div>
  <div id="missies">
    <button data-missie="belly"><b>De reus van de Lot</b><small>Belly boat met livescope: vang een meerval van 2 meter of meer</small></button>
    <button data-missie="kant"><b>Vanaf de kant</b><small>Werp in vanaf de oever of de steiger en vang drie vissen</small></button>
    <button data-missie="drone"><b>Wakker worden!</b><small>Vlieg met de drone door het torenraam en laat een glas water op de slaper vallen</small></button>
    <button data-missie="rat"><b>Beverratten</b><small>Schep er vijf vanaf de steiger voordat de tijd om is</small></button>
  </div>
</div>
<div id="hud" hidden>
  <canvas id="scope" width="960" height="540" hidden></canvas>
  <div id="missie"></div><div id="tel"></div><button id="stop">Menu</button><div id="weergave" hidden><button data-w="hoog">Hoog</button><button data-w="zelf">Zelf</button><button data-w="vol">Scope</button></div>
  <div id="melding" hidden></div><div id="pip" hidden><span>Paul &amp; Bob</span></div>
  <div id="meter" hidden></div><div id="span" hidden><i></i></div>
  <div id="stick" hidden><i></i></div>
  <button id="knopLinks" hidden></button><button id="knopRechts" hidden></button><button id="knopOp" hidden>▲</button><button id="knopNeer" hidden>▼</button>
  <button id="knopB" hidden></button><div id="slip" hidden><button id="slipPlus">+</button><span id="slipTekst">slip 75%</span><button id="slipMin">−</button></div><button id="knopA" hidden></button>
</div>
<div id="uitslag" hidden><div><h2 id="uitslagKop"></h2><p id="uitslagTekst"></p><button id="opnieuw">Nog een keer</button><button id="terug">Menu</button></div></div>
<div id="versie"></div>
